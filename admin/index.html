<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Face À La Mer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f3f0; color: #2c2c2c; min-height: 100vh; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    .login-box h1 { font-size: 1.5rem; color: #1a3a5c; margin-bottom: 4px; }
    .login-box p { color: #6b6b6b; font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 2px solid #e5e0da; border-radius: 8px; font-family: inherit; font-size: 0.9rem; background: #faf8f5; outline: none; transition: 0.2s; }
    .form-group input:focus { border-color: #d4a853; box-shadow: 0 0 0 3px rgba(212,168,83,0.15); }
    .btn { padding: 12px 28px; border: none; border-radius: 50px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #d4a853; color: #1a3a5c; }
    .btn-primary:hover { background: #c4956a; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-danger:hover { background: #c82333; }
    .btn-outline { background: transparent; border: 2px solid #d4a853; color: #d4a853; }
    .btn-outline:hover { background: #d4a853; color: #1a3a5c; }
    .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
    .error { color: #dc3545; font-size: 0.85rem; margin-top: 8px; display: none; }
    .success { color: #28a745; font-size: 0.85rem; margin-top: 8px; display: none; }
    .dashboard { display: none; }
    .dashboard.visible { display: block; }
    .topbar { background: #1a3a5c; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h2 { font-size: 1.1rem; }
    .topbar .user { font-size: 0.85rem; opacity: 0.8; }
    .tabs { display: flex; gap: 4px; background: #fff; padding: 0 24px; border-bottom: 2px solid #e5e0da; overflow-x: auto; }
    .tab { padding: 14px 20px; font-size: 0.9rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; white-space: nowrap; color: #6b6b6b; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
    .tab:hover { color: #1a3a5c; }
    .tab.active { color: #d4a853; border-bottom-color: #d4a853; }
    .tab-content { display: none; padding: 24px; max-width: 1000px; margin: 0 auto; }
    .tab-content.active { display: block; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 20px; }
    .card h3 { font-size: 1.05rem; color: #1a3a5c; margin-bottom: 16px; }
    .item-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0eee8; flex-wrap: wrap; }
    .item-row:last-child { border-bottom: none; }
    .item-row .info { flex: 1; min-width: 200px; }
    .item-row .info strong { display: block; font-size: 0.95rem; }
    .item-row .info span { font-size: 0.85rem; color: #6b6b6b; }
    .item-row .actions { display: flex; gap: 8px; }
    .empty-state { text-align: center; padding: 40px; color: #6b6b6b; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.visible { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 1.15rem; color: #1a3a5c; margin-bottom: 20px; }
    .modal .form-group textarea { width: 100%; padding: 12px 14px; border: 2px solid #e5e0da; border-radius: 8px; font-family: inherit; font-size: 0.9rem; background: #faf8f5; outline: none; resize: vertical; min-height: 80px; transition: 0.2s; }
    .modal .form-group textarea:focus { border-color: #d4a853; }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 0.9rem; z-index: 200; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }
    @media (max-width: 600px) {
      .login-box { padding: 24px; }
      .tabs { padding: 0 12px; }
      .tab { padding: 12px 14px; font-size: 0.85rem; }
      .tab-content { padding: 16px; }
      .modal { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Administration</h1>
    <p>Face À La Mer — Gérez votre contenu</p>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Entrez le mot de passe">
    </div>
    <div class="form-group">
      <label>Token GitHub (classic, scope: repo)</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
    </div>
    <div class="form-group">
      <label>Propriétaire du repo</label>
      <input type="text" id="repoOwner" value="hebergedev26">
    </div>
    <div class="form-group">
      <label>Nom du repo</label>
      <input type="text" id="repoName" value="face-a-la-mer">
    </div>
    <button class="btn btn-primary" onclick="login();return false" style="width:100%">Connexion</button>
    <div class="error" id="loginError">Mot de passe ou token incorrect</div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="topbar">
    <h2>⚙️ Face À La Mer — Admin</h2>
    <div><span class="user" id="statusText">Connecté</span> <button class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.3);margin-left:12px" onclick="logout()">Déconnexion</button></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="menu">🍽️ Menu</button>
    <button class="tab" data-tab="reviews">⭐ Avis</button>
    <button class="tab" data-tab="gallery">📷 Galerie</button>
    <button class="tab" data-tab="settings">⚙️ Paramètres</button>
  </div>

  <div class="tab-content active" id="tab-menu">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <h3>🍽️ Menu</h3>
        <button class="btn btn-primary btn-sm" onclick="openModal('menu')">+ Ajouter un plat</button>
      </div>
      <div id="menuList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-reviews">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <h3>⭐ Avis clients</h3>
        <button class="btn btn-primary btn-sm" onclick="openModal('review')">+ Ajouter un avis</button>
      </div>
      <div id="reviewsList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-gallery">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <h3>📷 Galerie</h3>
        <button class="btn btn-primary btn-sm" onclick="openModal('gallery')">+ Ajouter une photo</button>
      </div>
      <div id="galleryList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-settings">
    <div class="card">
      <h3>⚙️ Paramètres du restaurant</h3>
      <div id="settingsForm"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const ADMIN_PASSWORD = 'admin123';
const GH_API = 'https://api.github.com';
let ghToken = '', repoOwner = '', repoName = '';

// ===== AUTH =====
function login() {
  const pwd = document.getElementById('password').value;
  if (pwd !== ADMIN_PASSWORD) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  ghToken = document.getElementById('ghToken').value;
  repoOwner = document.getElementById('repoOwner').value.trim();
  repoName = document.getElementById('repoName').value.trim();
  if (!ghToken || !repoOwner || !repoName) {
    document.getElementById('loginError').textContent = 'Tous les champs sont requis';
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  localStorage.setItem('fam-admin-token', ghToken);
  localStorage.setItem('fam-admin-repo', JSON.stringify({ owner: repoOwner, name: repoName }));
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('visible');
  document.getElementById('statusText').textContent = `${repoOwner}/${repoName}`;
  initTabs();
  loadAll();
}

function logout() {
  localStorage.removeItem('fam-admin-token');
  localStorage.removeItem('fam-admin-repo');
  location.reload();
}

// Restore session
(function() {
  const savedToken = localStorage.getItem('fam-admin-token');
  const savedRepo = localStorage.getItem('fam-admin-repo');
  if (savedToken && savedRepo) {
    const r = JSON.parse(savedRepo);
    document.getElementById('ghToken').value = savedToken;
    document.getElementById('repoOwner').value = r.owner;
    document.getElementById('repoName').value = r.name;
  }
})();

// ===== TABS =====
function initTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });
}

// ===== GITHUB API =====
async function ghFetch(path, options = {}) {
  const res = await fetch(`${GH_API}${path}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${ghToken}`,
      'Accept': 'application/vnd.github.v3+json',
      ...options.headers,
    }
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`GitHub API error ${res.status}: ${err}`);
  }
  return res.json();
}

async function getFile(path) {
  try {
    const data = await ghFetch(`/repos/${repoOwner}/${repoName}/contents/${path}`);
    return { content: JSON.parse(atob(data.content)), sha: data.sha };
  } catch { return { content: null, sha: null }; }
}

async function saveFile(path, content, sha, message) {
  const body = { message, content: btoa(JSON.stringify(content, null, 2)), branch: 'main' };
  if (sha) body.sha = sha;
  await ghFetch(`/repos/${repoOwner}/${repoName}/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
}

// ===== DATA LOADING =====
let menuData = [], reviewsData = [], galleryData = [], settingsData = {};

async function loadAll() {
  const [menu, reviews, gallery, settings] = await Promise.all([
    getFile('data/menu.json'),
    getFile('data/reviews.json'),
    getFile('data/gallery.json'),
    getFile('data/settings.json'),
  ]);
  menuData = menu.content?.items || [];
  reviewsData = reviews.content || [];
  galleryData = gallery.content || [];
  settingsData = settings.content || {};
  renderMenu(); renderReviews(); renderGallery(); renderSettings();
  window._menuSha = menu.sha;
  window._reviewsSha = reviews.sha;
  window._gallerySha = gallery.sha;
  window._settingsSha = settings.sha;
}

// ===== RENDER MENU =====
const CATEGORIES = { entrees: 'Entrées', plats: 'Plats principaux', specialites: 'Spécialités', boissons: 'Boissons' };

function renderMenu() {
  const el = document.getElementById('menuList');
  if (!menuData.length) { el.innerHTML = '<div class="empty-state">Aucun plat pour l\'instant</div>'; return; }
  el.innerHTML = Object.entries(CATEGORIES).map(([key, label]) => `
    <div style="margin-bottom:16px">
      <h4 style="color:#1a3a5c;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #d4a853;display:inline-block">${label}</h4>
      ${menuData.filter(i => i.category === key).map(item => `
        <div class="item-row">
          <div class="info"><strong>${item.name}</strong><span>${item.price} — ${item.description}</span></div>
          <div class="actions">
            <button class="btn btn-sm btn-primary" onclick="openModal('menu', ${item.id})">Modifier</button>
            <button class="btn btn-sm btn-danger" onclick="deleteItem('menu', ${item.id})">Suppr.</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ===== RENDER REVIEWS =====
function renderReviews() {
  const el = document.getElementById('reviewsList');
  if (!reviewsData.length) { el.innerHTML = '<div class="empty-state">Aucun avis pour l\'instant</div>'; return; }
  el.innerHTML = reviewsData.map(r => `
    <div class="item-row">
      <div class="info"><strong>${r.author}</strong><span>${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)} — ${r.text.substring(0,80)}${r.text.length>80?'...':''}</span></div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="openModal('review', ${r.id})">Modifier</button>
        <button class="btn btn-sm btn-danger" onclick="deleteItem('review', ${r.id})">Suppr.</button>
      </div>
    </div>
  `).join('');
}

// ===== RENDER GALLERY =====
function renderGallery() {
  const el = document.getElementById('galleryList');
  if (!galleryData.length) { el.innerHTML = '<div class="empty-state">Aucune photo pour l\'instant</div>'; return; }
  el.innerHTML = galleryData.map(g => `
    <div class="item-row">
      <div class="info"><strong>${g.label}</strong><span>${g.alt}</span></div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="openModal('gallery', ${g.id})">Modifier</button>
        <button class="btn btn-sm btn-danger" onclick="deleteItem('gallery', ${g.id})">Suppr.</button>
      </div>
    </div>
  `).join('');
}

// ===== RENDER SETTINGS =====
function renderSettings() {
  const el = document.getElementById('settingsForm');
  const fields = [
    { key: 'phone', label: 'Téléphone (affichage)' },
    { key: 'phoneRaw', label: 'Téléphone (format brut, ex: +2290146075817)' },
    { key: 'email', label: 'Email' },
    { key: 'address', label: 'Adresse' },
    { key: 'hoursWeek', label: 'Jours d\'ouverture' },
    { key: 'hoursTime', label: 'Horaires' },
    { key: 'rating', label: 'Note (ex: 4.1)' },
    { key: 'reviewCount', label: 'Nombre d\'avis (ex: 313+)' },
    { key: 'whatsappMsg', label: 'Message WhatsApp par défaut' },
  ];
  el.innerHTML = fields.map(f => `
    <div class="form-group">
      <label>${f.label}</label>
      <input type="text" id="set-${f.key}" value="${(settingsData[f.key] || '').replace(/"/g,'&quot;')}">
    </div>
  `).join('') + `
    <button class="btn btn-primary" onclick="saveSettings()">💾 Enregistrer les paramètres</button>
  `;
}

// ===== MODAL =====
let modalMode = '', modalId = null;

function openModal(type, id) {
  modalMode = type; modalId = id || null;
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('visible');
  if (type === 'menu') openMenuModal(id);
  else if (type === 'review') openReviewModal(id);
  else if (type === 'gallery') openGalleryModal(id);
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('visible'); }

function openMenuModal(id) {
  const item = id ? menuData.find(i => i.id === id) : { category: 'entrees', name: '', price: '', description: '' };
  document.getElementById('modalContent').innerHTML = `
    <h3>${id ? 'Modifier' : 'Ajouter'} un plat</h3>
    <div class="form-group"><label>Catégorie</label><select id="m-cat">
      ${Object.entries(CATEGORIES).map(([k,v]) => `<option value="${k}"${item.category===k?' selected':''}>${v}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Nom</label><input type="text" id="m-name" value="${item.name}"></div>
    <div class="form-group"><label>Prix</label><input type="text" id="m-price" value="${item.price}"></div>
    <div class="form-group"><label>Description</label><textarea id="m-desc">${item.description}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveMenuItem()">${id ? 'Modifier' : 'Ajouter'}</button>
    </div>
  `;
}

function openReviewModal(id) {
  const r = id ? reviewsData.find(i => i.id === id) : { stars: 5, text: '', author: '' };
  document.getElementById('modalContent').innerHTML = `
    <h3>${id ? 'Modifier' : 'Ajouter'} un avis</h3>
    <div class="form-group"><label>Étoiles (1-5)</label><select id="r-stars">
      ${[1,2,3,4,5].map(s => `<option value="${s}"${r.stars===s?' selected':''}>${'★'.repeat(s)}${'☆'.repeat(5-s)}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Auteur</label><input type="text" id="r-author" value="${r.author}"></div>
    <div class="form-group"><label>Texte</label><textarea id="r-text">${r.text}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveReview()">${id ? 'Modifier' : 'Ajouter'}</button>
    </div>
  `;
}

function openGalleryModal(id) {
  const g = id ? galleryData.find(i => i.id === id) : { src: '', thumb: '', alt: '', label: '', wide: false, tall: false };
  document.getElementById('modalContent').innerHTML = `
    <h3>${id ? 'Modifier' : 'Ajouter'} une photo</h3>
    <div class="form-group"><label>Label</label><input type="text" id="g-label" value="${g.label}"></div>
    <div class="form-group"><label>Texte alternatif</label><input type="text" id="g-alt" value="${g.alt}"></div>
    <div class="form-group"><label>URL grande image</label><input type="text" id="g-src" value="${g.src}"></div>
    <div class="form-group"><label>URL miniature</label><input type="text" id="g-thumb" value="${g.thumb}"></div>
    <div class="form-group"><label><input type="checkbox" id="g-wide" ${g.wide?'checked':''}> Large (2 colonnes)</label></div>
    <div class="form-group"><label><input type="checkbox" id="g-tall" ${g.tall?'checked':''}> Haute (2 rangées)</label></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveGalleryItem()">${id ? 'Modifier' : 'Ajouter'}</button>
    </div>
  `;
}

// ===== SAVE =====
async function saveMenuItem() {
  const cat = document.getElementById('m-cat').value;
  const name = document.getElementById('m-name').value.trim();
  const price = document.getElementById('m-price').value.trim();
  const desc = document.getElementById('m-desc').value.trim();
  if (!name || !price) return showToast('Nom et prix requis', 'error');
  if (modalId) {
    const idx = menuData.findIndex(i => i.id === modalId);
    if (idx >= 0) menuData[idx] = { ...menuData[idx], category: cat, name, price, description: desc };
  } else {
    menuData.push({ id: Date.now(), category: cat, name, price, description: desc });
  }
  await saveMenuToGitHub();
  renderMenu(); closeModal(); showToast('Menu mis à jour ✓', 'success');
}

async function saveReview() {
  const stars = parseInt(document.getElementById('r-stars').value);
  const author = document.getElementById('r-author').value.trim();
  const text = document.getElementById('r-text').value.trim();
  if (!author || !text) return showToast('Auteur et texte requis', 'error');
  if (modalId) {
    const idx = reviewsData.findIndex(i => i.id === modalId);
    if (idx >= 0) reviewsData[idx] = { ...reviewsData[idx], stars, author, text };
  } else {
    reviewsData.push({ id: Date.now(), stars, author, text });
  }
  await saveReviewsToGitHub();
  renderReviews(); closeModal(); showToast('Avis mis à jour ✓', 'success');
}

async function saveGalleryItem() {
  const label = document.getElementById('g-label').value.trim();
  const alt = document.getElementById('g-alt').value.trim();
  const src = document.getElementById('g-src').value.trim();
  const thumb = document.getElementById('g-thumb').value.trim();
  const wide = document.getElementById('g-wide').checked;
  const tall = document.getElementById('g-tall').checked;
  if (!label || !src) return showToast('Label et URL requis', 'error');
  const item = { label, alt, src, thumb: thumb || src, wide, tall };
  if (modalId) {
    const idx = galleryData.findIndex(i => i.id === modalId);
    if (idx >= 0) galleryData[idx] = { id: modalId, ...item };
  } else {
    galleryData.push({ id: Date.now(), ...item });
  }
  await saveGalleryToGitHub();
  renderGallery(); closeModal(); showToast('Galerie mise à jour ✓', 'success');
}

async function saveSettings() {
  const keys = ['phone','phoneRaw','email','address','hoursWeek','hoursTime','rating','reviewCount','whatsappMsg'];
  keys.forEach(k => { settingsData[k] = document.getElementById(`set-${k}`).value; });
  await saveSettingsToGitHub();
  renderSettings(); showToast('Paramètres enregistrés ✓', 'success');
}

// ===== DELETE =====
async function deleteItem(type, id) {
  if (!confirm('Supprimer cet élément ?')) return;
  if (type === 'menu') { menuData = menuData.filter(i => i.id !== id); await saveMenuToGitHub(); renderMenu(); }
  if (type === 'review') { reviewsData = reviewsData.filter(i => i.id !== id); await saveReviewsToGitHub(); renderReviews(); }
  if (type === 'gallery') { galleryData = galleryData.filter(i => i.id !== id); await saveGalleryToGitHub(); renderGallery(); }
  showToast('Élément supprimé ✓', 'success');
}

// ===== GITHUB SAVE HELPERS =====
async function saveMenuToGitHub() {
  await saveFile('data/menu.json', { items: menuData }, window._menuSha, 'Mise à jour du menu');
}

async function saveReviewsToGitHub() {
  await saveFile('data/reviews.json', reviewsData, window._reviewsSha, 'Mise à jour des avis');
}

async function saveGalleryToGitHub() {
  await saveFile('data/gallery.json', galleryData, window._gallerySha, 'Mise à jour de la galerie');
}

async function saveSettingsToGitHub() {
  await saveFile('data/settings.json', settingsData, window._settingsSha, 'Mise à jour des paramètres');
}

// ===== TOAST =====
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
