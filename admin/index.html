<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Face À La Mer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f5f3f0; color: #2c2c2c; min-height: 100vh; }
    input, select, textarea, button { font-family: inherit; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    .login-box h1 { font-size: 1.5rem; color: #1a3a5c; margin-bottom: 4px; }
    .login-box p { color: #6b6b6b; font-size: 0.9rem; margin-bottom: 24px; }
    .login-box .form-group { margin-bottom: 16px; }
    .login-box .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; }
    .login-box .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e5e0da; border-radius: 8px; font-size: 0.9rem; background: #faf8f5; outline: none; transition: 0.2s; }
    .login-box .form-group input:focus { border-color: #d4a853; box-shadow: 0 0 0 3px rgba(212,168,83,0.15); }
    .btn { padding: 12px 28px; border: none; border-radius: 50px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #d4a853; color: #1a3a5c; }
    .btn-primary:hover { background: #c4956a; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-danger:hover { background: #c82333; }
    .btn-outline { background: transparent; border: 2px solid #d4a853; color: #d4a853; }
    .btn-outline:hover { background: #d4a853; color: #1a3a5c; }
    .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #dc3545; font-size: 0.85rem; margin-top: 8px; display: none; }
    .topbar { background: #1a3a5c; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h2 { font-size: 1.1rem; }
    .topbar .user { font-size: 0.85rem; opacity: 0.8; }
    .tabs { display: flex; gap: 4px; background: #fff; padding: 0 24px; border-bottom: 2px solid #e5e0da; overflow-x: auto; }
    .tab { padding: 14px 20px; font-size: 0.9rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; white-space: nowrap; color: #6b6b6b; background: none; border-top: none; border-left: none; border-right: none; }
    .tab:hover { color: #1a3a5c; }
    .tab.active { color: #d4a853; border-bottom-color: #d4a853; }
    .tab-content { display: none; padding: 24px; max-width: 1000px; margin: 0 auto; }
    .tab-content.active { display: block; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 20px; }
    .card h3 { font-size: 1.05rem; color: #1a3a5c; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .item-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0eee8; flex-wrap: wrap; }
    .item-row:last-child { border-bottom: none; }
    .item-row .info { flex: 1; min-width: 200px; }
    .item-row .info strong { display: block; font-size: 0.95rem; }
    .item-row .info span { font-size: 0.85rem; color: #6b6b6b; }
    .item-row .actions { display: flex; gap: 8px; }
    .empty-state { text-align: center; padding: 40px; color: #6b6b6b; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.visible { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 1.15rem; color: #1a3a5c; margin-bottom: 20px; }
    .modal .form-group { margin-bottom: 16px; }
    .modal .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; }
    .modal .form-group input, .modal .form-group select, .modal .form-group textarea { width: 100%; padding: 12px 14px; border: 2px solid #e5e0da; border-radius: 8px; font-size: 0.9rem; background: #faf8f5; outline: none; transition: 0.2s; }
    .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { border-color: #d4a853; box-shadow: 0 0 0 3px rgba(212,168,83,0.15); }
    .modal .form-group textarea { resize: vertical; min-height: 80px; }
    .modal .form-group.checkbox { display: flex; align-items: center; gap: 8px; }
    .modal .form-group.checkbox label { margin-bottom: 0; cursor: pointer; }
    .modal .form-group.checkbox input { width: auto; }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 0.9rem; animation: slideIn 0.3s ease; }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #1a3a5c; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
    .badge-entrees { background: #e8f5e9; color: #2e7d32; }
    .badge-plats { background: #e3f2fd; color: #1565c0; }
    .badge-specialites { background: #fff3e0; color: #e65100; }
    .badge-boissons { background: #f3e5f5; color: #7b1fa2; }
    .category-label { font-size: 0.9rem; font-weight: 600; color: #1a3a5c; padding-bottom: 6px; border-bottom: 2px solid #d4a853; display: inline-block; margin-bottom: 8px; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .settings-grid .form-group { margin-bottom: 0; }
    @media (max-width: 600px) {
      .login-box { padding: 24px; }
      .tabs { padding: 0 12px; }
      .tab { padding: 12px 14px; font-size: 0.85rem; }
      .tab-content { padding: 16px; }
      .modal { padding: 20px; }
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAHR4yTj2QmcamgAPviiPbSp5QybWJqa-E",
      authDomain: "face-a-la-mer-b4ef3.firebaseapp.com",
      projectId: "face-a-la-mer-b4ef3",
      storageBucket: "face-a-la-mer-b4ef3.firebasestorage.app",
      messagingSenderId: "24607256556",
      appId: "1:24607256556:web:73baba28fe1a1c528b9ac9"
    };

    const CATEGORIES = { entrees: 'Entrées', plats: 'Plats principaux', specialites: 'Spécialités', boissons: 'Boissons' };

    const { useState, useEffect, useCallback } = React;

    // ====== Firebase Init ======
    let app, auth, db;
    try {
      app = firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth(app);
      db = firebase.firestore(app);
    } catch (e) {
      console.warn('Firebase non configuré:', e.message);
    }

    // ====== Toast System ======
    const ToastContext = React.createContext();
    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((msg, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      }, []);
      return React.createElement(React.Fragment, null,
        children,
        React.createElement('div', { className: 'toast-container' },
          toasts.map(t => React.createElement('div', { key: t.id, className: `toast ${t.type}` }, t.msg))
        )
      );
    }

    // ====== Login Page ======
    function LoginPage({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          await auth.signInWithEmailAndPassword(email, password);
          onLogin();
        } catch (err) {
          setError(err.message === 'The password is invalid or the user does not have a password.'
            ? 'Email ou mot de passe incorrect'
            : err.message === 'There is no user record corresponding to this identifier.'
            ? 'Aucun compte trouvé avec cet email'
            : err.message);
        } finally {
          setLoading(false);
        }
      };

      return React.createElement('div', { className: 'login-screen' },
        React.createElement('div', { className: 'login-box' },
          React.createElement('h1', null, '🔐 Administration'),
          React.createElement('p', null, 'Face À La Mer — Gérez votre contenu'),
          React.createElement('form', { onSubmit: handleLogin },
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Email'),
              React.createElement('input', { type: 'email', value: email, onChange: e => setEmail(e.target.value), placeholder: 'admin@example.com', required: true })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Mot de passe'),
              React.createElement('input', { type: 'password', value: password, onChange: e => setPassword(e.target.value), placeholder: '••••••••', required: true })
            ),
            error && React.createElement('div', { style: { color: '#dc3545', fontSize: '0.85rem', marginBottom: '16px' } }, error),
            React.createElement('button', { type: 'submit', className: 'btn btn-primary', style: { width: '100%', justifyContent: 'center' }, disabled: loading },
              loading ? React.createElement(React.Fragment, null, React.createElement('span', { className: 'spinner' }), ' Connexion...') : 'Se connecter'
            )
          )
        )
      );
    }

    // ====== Dashboard ======
    function Dashboard({ onLogout }) {
      const [tab, setTab] = useState('menu');

      const tabs = [
        { id: 'menu', label: '🍽️ Menu' },
        { id: 'reviews', label: '⭐ Avis' },
        { id: 'gallery', label: '📷 Galerie' },
        { id: 'settings', label: '⚙️ Paramètres' },
      ];

      return React.createElement('div', null,
        React.createElement('div', { className: 'topbar' },
          React.createElement('h2', null, '⚙️ Face À La Mer — Admin'),
          React.createElement('div', null,
            React.createElement('span', { className: 'user' }, auth.currentUser?.email || 'Connecté'),
            React.createElement('button', { className: 'btn btn-sm btn-outline', style: { color: '#fff', borderColor: 'rgba(255,255,255,0.3)', marginLeft: '12px' }, onClick: () => { auth.signOut(); onLogout(); } }, 'Déconnexion')
          )
        ),
        React.createElement('div', { className: 'tabs' },
          tabs.map(t => React.createElement('button', {
            key: t.id,
            className: `tab ${tab === t.id ? 'active' : ''}`,
            onClick: () => setTab(t.id)
          }, t.label))
        ),
        React.createElement('div', { className: `tab-content ${tab === 'menu' ? 'active' : ''}` },
          tab === 'menu' && React.createElement(MenuManager, null)
        ),
        React.createElement('div', { className: `tab-content ${tab === 'reviews' ? 'active' : ''}` },
          tab === 'reviews' && React.createElement(ReviewsManager, null)
        ),
        React.createElement('div', { className: `tab-content ${tab === 'gallery' ? 'active' : ''}` },
          tab === 'gallery' && React.createElement(GalleryManager, null)
        ),
        React.createElement('div', { className: `tab-content ${tab === 'settings' ? 'active' : ''}` },
          tab === 'settings' && React.createElement(SettingsManager, null)
        )
      );
    }

    // ====== Modal ======
    function Modal({ title, children, onClose }) {
      return React.createElement('div', { className: 'modal-overlay visible', onClick: e => { if (e.target === e.currentTarget) onClose(); } },
        React.createElement('div', { className: 'modal' },
          React.createElement('h3', null, title),
          children
        )
      );
    }

    // ====== Menu Manager ======
    function MenuManager() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null);
      const addToast = React.useContext(ToastContext);

      const load = useCallback(async () => {
        try {
          const snap = await db.collection('menu').orderBy('id').get();
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (e) { addToast('Erreur chargement menu: ' + e.message, 'error'); }
        finally { setLoading(false); }
      }, []);

      useEffect(() => { load(); }, []);

      const save = async (data) => {
        try {
          if (data.id) {
            await db.collection('menu').doc(data.id).update(data);
            addToast('Plat modifié ✓');
          } else {
            const count = items.length;
            await db.collection('menu').add({ ...data, id: Date.now() });
            addToast('Plat ajouté ✓');
          }
          setModal(null);
          load();
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
      };

      const remove = async (docId) => {
        if (!confirm('Supprimer ce plat ?')) return;
        try {
          await db.collection('menu').doc(docId).delete();
          addToast('Plat supprimé ✓');
          load();
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
      };

      if (loading) return React.createElement('div', { className: 'card' }, React.createElement('div', { className: 'empty-state' }, 'Chargement...'));

      return React.createElement(React.Fragment, null,
        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'card-header' },
            React.createElement('h3', null, '🍽️ Menu'),
            React.createElement('button', { className: 'btn btn-primary btn-sm', onClick: () => setModal({}) }, '+ Ajouter un plat')
          ),
          items.length === 0
            ? React.createElement('div', { className: 'empty-state' }, 'Aucun plat pour l\'instant')
            : Object.entries(CATEGORIES).map(([key, label]) => {
                const filtered = items.filter(i => i.category === key);
                if (!filtered.length) return null;
                return React.createElement('div', { key, style: { marginBottom: '16px' } },
                  React.createElement('div', { className: 'category-label' }, label),
                  filtered.map(item => React.createElement('div', { key: item.id, className: 'item-row' },
                    React.createElement('div', { className: 'info' },
                      React.createElement('strong', null, item.name),
                      React.createElement('span', null, `${item.price} — ${item.description}`)
                    ),
                    React.createElement('div', { className: 'actions' },
                      React.createElement('button', { className: 'btn btn-sm btn-primary', onClick: () => setModal(item) }, 'Modifier'),
                      React.createElement('button', { className: 'btn btn-sm btn-danger', onClick: () => remove(item.id) }, 'Suppr.')
                    )
                  ))
                );
              })
        ),
        modal && React.createElement(ItemModal, {
          title: `${modal.id ? 'Modifier' : 'Ajouter'} un plat`,
          fields: [
            { key: 'category', label: 'Catégorie', type: 'select', options: CATEGORIES, value: modal.category || 'entrees' },
            { key: 'name', label: 'Nom', value: modal.name || '' },
            { key: 'price', label: 'Prix', value: modal.price || '' },
            { key: 'description', label: 'Description', type: 'textarea', value: modal.description || '' },
          ],
          onSave: (data) => save({ ...modal, ...data }),
          onClose: () => setModal(null)
        })
      );
    }

    // ====== Reviews Manager ======
    function ReviewsManager() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null);
      const addToast = React.useContext(ToastContext);

      const load = useCallback(async () => {
        try {
          const snap = await db.collection('reviews').orderBy('id').get();
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
        finally { setLoading(false); }
      }, []);

      useEffect(() => { load(); }, []);

      const save = async (data) => {
        try {
          if (data.id) {
            await db.collection('reviews').doc(data.id).update(data);
            addToast('Avis modifié ✓');
          } else {
            await db.collection('reviews').add({ ...data, id: Date.now() });
            addToast('Avis ajouté ✓');
          }
          setModal(null);
          load();
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
      };

      const remove = async (docId) => {
        if (!confirm('Supprimer cet avis ?')) return;
        await db.collection('reviews').doc(docId).delete();
        addToast('Avis supprimé ✓');
        load();
      };

      if (loading) return React.createElement('div', { className: 'card' }, React.createElement('div', { className: 'empty-state' }, 'Chargement...'));

      return React.createElement(React.Fragment, null,
        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'card-header' },
            React.createElement('h3', null, '⭐ Avis clients'),
            React.createElement('button', { className: 'btn btn-primary btn-sm', onClick: () => setModal({}) }, '+ Ajouter un avis')
          ),
          items.length === 0
            ? React.createElement('div', { className: 'empty-state' }, 'Aucun avis pour l\'instant')
            : items.map(r => React.createElement('div', { key: r.id, className: 'item-row' },
                React.createElement('div', { className: 'info' },
                  React.createElement('strong', null, r.author),
                  React.createElement('span', null, `${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)} — ${r.text.substring(0, 80)}${r.text.length > 80 ? '...' : ''}`)
                ),
                React.createElement('div', { className: 'actions' },
                  React.createElement('button', { className: 'btn btn-sm btn-primary', onClick: () => setModal(r) }, 'Modifier'),
                  React.createElement('button', { className: 'btn btn-sm btn-danger', onClick: () => remove(r.id) }, 'Suppr.')
                )
              ))
        ),
        modal && React.createElement(ItemModal, {
          title: `${modal.id ? 'Modifier' : 'Ajouter'} un avis`,
          fields: [
            { key: 'stars', label: 'Étoiles', type: 'select', options: { 5: '★★★★★', 4: '★★★★☆', 3: '★★★☆☆', 2: '★★☆☆☆', 1: '★☆☆☆☆' }, value: modal.stars || 5 },
            { key: 'author', label: 'Auteur', value: modal.author || '' },
            { key: 'text', label: 'Texte', type: 'textarea', value: modal.text || '' },
          ],
          onSave: (data) => save({ ...modal, ...data }),
          onClose: () => setModal(null)
        })
      );
    }

    // ====== Gallery Manager ======
    function GalleryManager() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null);
      const addToast = React.useContext(ToastContext);

      const load = useCallback(async () => {
        try {
          const snap = await db.collection('gallery').orderBy('id').get();
          setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
        finally { setLoading(false); }
      }, []);

      useEffect(() => { load(); }, []);

      const save = async (data) => {
        try {
          if (data.id) {
            await db.collection('gallery').doc(data.id).update(data);
            addToast('Photo modifiée ✓');
          } else {
            await db.collection('gallery').add({ ...data, id: Date.now() });
            addToast('Photo ajoutée ✓');
          }
          setModal(null);
          load();
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
      };

      const remove = async (docId) => {
        if (!confirm('Supprimer cette photo ?')) return;
        await db.collection('gallery').doc(docId).delete();
        addToast('Photo supprimée ✓');
        load();
      };

      if (loading) return React.createElement('div', { className: 'card' }, React.createElement('div', { className: 'empty-state' }, 'Chargement...'));

      return React.createElement(React.Fragment, null,
        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'card-header' },
            React.createElement('h3', null, '📷 Galerie'),
            React.createElement('button', { className: 'btn btn-primary btn-sm', onClick: () => setModal({}) }, '+ Ajouter une photo')
          ),
          items.length === 0
            ? React.createElement('div', { className: 'empty-state' }, 'Aucune photo pour l\'instant')
            : items.map(g => React.createElement('div', { key: g.id, className: 'item-row' },
                React.createElement('div', { className: 'info' },
                  React.createElement('strong', null, g.label),
                  React.createElement('span', null, g.alt)
                ),
                React.createElement('div', { className: 'actions' },
                  React.createElement('button', { className: 'btn btn-sm btn-primary', onClick: () => setModal(g) }, 'Modifier'),
                  React.createElement('button', { className: 'btn btn-sm btn-danger', onClick: () => remove(g.id) }, 'Suppr.')
                )
              ))
        ),
        modal && React.createElement(ItemModal, {
          title: `${modal.id ? 'Modifier' : 'Ajouter'} une photo`,
          fields: [
            { key: 'label', label: 'Label', value: modal.label || '' },
            { key: 'alt', label: 'Texte alternatif', value: modal.alt || '' },
            { key: 'src', label: 'URL grande image', value: modal.src || '' },
            { key: 'thumb', label: 'URL miniature', value: modal.thumb || modal.src || '' },
            { key: 'wide', label: 'Large (2 colonnes)', type: 'checkbox', value: modal.wide || false },
            { key: 'tall', label: 'Haute (2 rangées)', type: 'checkbox', value: modal.tall || false },
          ],
          onSave: (data) => save({ ...modal, ...data }),
          onClose: () => setModal(null)
        })
      );
    }

    // ====== Settings Manager ======
    function SettingsManager() {
      const [settings, setSettings] = useState({});
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const addToast = React.useContext(ToastContext);

      const fields = [
        { key: 'phone', label: 'Téléphone (affichage)' },
        { key: 'phoneRaw', label: 'Téléphone (format brut, ex: +2290146075817)' },
        { key: 'email', label: 'Email' },
        { key: 'address', label: 'Adresse' },
        { key: 'hoursWeek', label: "Jours d'ouverture" },
        { key: 'hoursTime', label: 'Horaires' },
        { key: 'rating', label: 'Note (ex: 4.1)' },
        { key: 'reviewCount', label: "Nombre d'avis (ex: 313+)" },
        { key: 'whatsappMsg', label: 'Message WhatsApp par défaut' },
      ];

      const load = useCallback(async () => {
        try {
          const doc = await db.collection('settings').doc('restaurant').get();
          if (doc.exists) setSettings(doc.data());
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
        finally { setLoading(false); }
      }, []);

      useEffect(() => { load(); }, []);

      const save = async () => {
        setSaving(true);
        try {
          await db.collection('settings').doc('restaurant').set(settings);
          addToast('Paramètres enregistrés ✓');
        } catch (e) { addToast('Erreur: ' + e.message, 'error'); }
        finally { setSaving(false); }
      };

      if (loading) return React.createElement('div', { className: 'card' }, React.createElement('div', { className: 'empty-state' }, 'Chargement...'));

      return React.createElement('div', { className: 'card' },
        React.createElement('h3', null, '⚙️ Paramètres du restaurant'),
        React.createElement('div', { className: 'settings-grid' },
          fields.map(f => React.createElement('div', { key: f.key, className: 'form-group' },
            React.createElement('label', null, f.label),
            React.createElement('input', { type: 'text', value: settings[f.key] || '', onChange: e => setSettings(s => ({ ...s, [f.key]: e.target.value })) })
          ))
        ),
        React.createElement('button', { className: 'btn btn-primary', style: { marginTop: '20px' }, onClick: save, disabled: saving },
          saving ? 'Enregistrement...' : '💾 Enregistrer les paramètres'
        )
      );
    }

    // ====== Reusable Item Modal ======
    function ItemModal({ title, fields, onSave, onClose }) {
      const [data, setData] = useState(() => {
        const obj = {};
        fields.forEach(f => { obj[f.key] = f.value !== undefined ? f.value : ''; });
        return obj;
      });

      const handleChange = (key, val) => setData(d => ({ ...d, [key]: val }));

      return React.createElement(Modal, { title, onClose },
        fields.map(f => {
          if (f.type === 'select') {
            return React.createElement('div', { key: f.key, className: 'form-group' },
              React.createElement('label', null, f.label),
              React.createElement('select', { value: data[f.key], onChange: e => handleChange(f.key, parseInt(e.target.value) || e.target.value) },
                Object.entries(f.options).map(([k, v]) => React.createElement('option', { key: k, value: k }, v))
              )
            );
          }
          if (f.type === 'textarea') {
            return React.createElement('div', { key: f.key, className: 'form-group' },
              React.createElement('label', null, f.label),
              React.createElement('textarea', { value: data[f.key], onChange: e => handleChange(f.key, e.target.value) })
            );
          }
          if (f.type === 'checkbox') {
            return React.createElement('div', { key: f.key, className: 'form-group checkbox' },
              React.createElement('input', { type: 'checkbox', id: f.key, checked: data[f.key], onChange: e => handleChange(f.key, e.target.checked) }),
              React.createElement('label', { htmlFor: f.key }, f.label)
            );
          }
          return React.createElement('div', { key: f.key, className: 'form-group' },
            React.createElement('label', null, f.label),
            React.createElement('input', { type: 'text', value: data[f.key], onChange: e => handleChange(f.key, e.target.value) })
          );
        }),
        React.createElement('div', { className: 'modal-actions' },
          React.createElement('button', { className: 'btn btn-outline', onClick: onClose }, 'Annuler'),
          React.createElement('button', { className: 'btn btn-primary', onClick: () => onSave(data) }, title.startsWith('Ajouter') ? 'Ajouter' : 'Modifier')
        )
      );
    }

    // ====== App ======
    function App() {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);

      useEffect(() => {
        if (!auth) { setChecking(false); return; }
        const unsub = auth.onAuthStateChanged(u => {
          setUser(u);
          setChecking(false);
        });
        return unsub;
      }, []);

      if (!app) {
        return React.createElement('div', { className: 'login-screen' },
          React.createElement('div', { className: 'login-box', style: { textAlign: 'center' } },
            React.createElement('h1', null, '🔐 Configuration requise'),
            React.createElement('p', null, 'Firebase n\'est pas configuré. Modifiez FIREBASE_CONFIG dans admin/index.html.'),
            React.createElement('a', { href: 'https://console.firebase.google.com', target: '_blank', className: 'btn btn-primary' }, 'Créer un projet Firebase')
          )
        );
      }

      if (checking) {
        return React.createElement('div', { className: 'login-screen' },
          React.createElement('div', { className: 'spinner', style: { width: 40, height: 40 } })
        );
      }

      return user ? React.createElement(Dashboard, { onLogout: () => setUser(null) }) : React.createElement(LoginPage, { onLogin: () => {} });
    }

    // ====== Render ======
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ToastProvider, null,
        React.createElement(App, null)
      )
    );
  </script>
</body>
</html>
