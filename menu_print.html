<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu — Face À La Mer</title>
  <style>
    @page { size: A4; margin: 14mm; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #1a3a5c; -webkit-print-color-adjust: exact; }
    .sheet { max-width: 180mm; margin: 0 auto; }
    .pdf-header { text-align: center; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 3px solid #d4a853; }
    .pdf-header h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; letter-spacing: 1px; }
    .pdf-header h1 span { color: #d4a853; }
    .pdf-header .sub { font-size: 12px; color: #6b6b6b; margin-top: 4px; }
    .pdf-header .contact { font-size: 11px; color: #8a8a8a; margin-top: 6px; }
    .cat { margin-bottom: 18px; }
    .cat h2 { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; color: #1a3a5c; border-bottom: 2px solid #d4a853; padding-bottom: 6px; margin-bottom: 8px; }
    .item { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0 2px; }
    .item .name { font-size: 13.5px; font-weight: 600; }
    .item .dots { flex: 1; border-bottom: 2px dotted #d4a853; margin: 0 8px; transform: translateY(-3px); }
    .item .price { font-size: 13.5px; font-weight: 700; color: #d4a853; white-space: nowrap; }
    .desc { font-size: 11.5px; color: #6b6b6b; margin-bottom: 6px; }
    .pdf-footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 10px; color: #9a9a9a; padding-top: 8px; border-top: 1px solid #eee; }
    .badge { display: inline-block; background: #1a3a5c; color: #fff; font-size: 9px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="pdf-header">
      <h1>Face <span>À La</span> Mer</h1>
      <div class="sub">Restaurant &amp; Bar — Fidjrossé, Cotonou</div>
      <div class="contact">Route des Pêches, Fidjrossé, Cotonou, Bénin · ☎ +229 01 46 07 58 17 · Lundi – Dimanche 11h00 – 23h00</div>
    </div>
    <div id="content">Chargement de la carte...</div>
    <div class="pdf-footer">Face À La Mer — Fidjrossé, Cotonou · Prix susceptibles de varier</div>
  </div>
  <script>
    const CATS = [
      { id: 'entrees', label: 'Entrées' },
      { id: 'plats', label: 'Plats principaux' },
      { id: 'specialites', label: 'Spécialités' },
      { id: 'boissons', label: 'Boissons' }
    ];
    const MENU_JSON = {"items":[
      { "id": 1, "category": "entrees", "name": "Salade Africaine", "price": "4 500 FCFA", "description": "Légumes frais, avocat, œuf dur, vinaigrette maison" },
      { "id": 2, "category": "entrees", "name": "Beignets de Poisson", "price": "3 500 FCFA", "description": "Filet de poisson pané, sauce épicée" },
      { "id": 3, "category": "entrees", "name": "Samoussas (6 pcs)", "price": "3 000 FCFA", "description": "Viande hachée, légumes, herbes" },
      { "id": 4, "category": "entrees", "name": "Avocat Crevettes", "price": "5 000 FCFA", "description": "Avocat garni de crevettes, sauce cocktail" },
      { "id": 5, "category": "plats", "name": "Poulet Braisé", "price": "6 000 FCFA", "description": "Poulet grillé, attiéké, légumes" },
      { "id": 6, "category": "plats", "name": "Poisson Grillé (Bar)", "price": "7 500 FCFA", "description": "Poisson frais grillé, alloco, sauce" },
      { "id": 7, "category": "plats", "name": "Pizza Face À La Mer", "price": "6 500 FCFA", "description": "Crevettes, poulet, champignons, fromage" },
      { "id": 8, "category": "plats", "name": "Riz Poisson", "price": "5 500 FCFA", "description": "Riz parfumé, poisson frais, légumes" },
      { "id": 9, "category": "plats", "name": "Spaghetti Fruits de Mer", "price": "6 000 FCFA", "description": "Crevettes, calamars, moules, sauce tomate" },
      { "id": 10, "category": "plats", "name": "Brochette de Bœuf", "price": "5 000 FCFA", "description": "Brochettes grillées, frites, sauce" },
      { "id": 11, "category": "specialites", "name": "Assiette de Fruits de Mer", "price": "12 000 FCFA", "description": "Plateau de fruits de mer frais (pour 2 personnes)" },
      { "id": 12, "category": "specialites", "name": "Gambas Grillées", "price": "9 000 FCFA", "description": "Gambas flambées au whisky, riz" },
      { "id": 13, "category": "specialites", "name": "Mix Grill", "price": "8 000 FCFA", "description": "Assortiment de viandes grillées, frites" },
      { "id": 14, "category": "boissons", "name": "Jus de Fruits Frais", "price": "2 000 FCFA", "description": "Bissap, gingembre, tamarin, ananas" },
      { "id": 15, "category": "boissons", "name": "Cocktail Maison", "price": "4 000 FCFA", "description": "Mojito, Piña Colada, Sunrise" },
      { "id": 16, "category": "boissons", "name": "Boissons Gazeuses", "price": "1 000 FCFA", "description": "Coca-Cola, Fanta, Sprite, Oasis" },
      { "id": 17, "category": "boissons", "name": "Bière Locale & Importée", "price": "1 500 – 3 000 FCFA", "description": "La Béninoise, Heineken, Flag" },
      { "id": 18, "category": "boissons", "name": "Vin au Verre", "price": "3 000 FCFA", "description": "Rouge, Blanc, Rosé" },
      { "id": 19, "category": "boissons", "name": "Eau Minérale", "price": "500 FCFA", "description": "50cl / 1.5L" }
    ]};
    const items = MENU_JSON.items;
    document.getElementById('content').innerHTML = CATS.map(cat => {
      const list = items.filter(i => i.category === cat.id);
      if (!list.length) return '';
      return `<div class="cat">
        <h2>${cat.label}<span class="badge">${list.length}</span></h2>
        ${list.map(it => `<div class="item"><span class="name">${it.name}</span><span class="dots"></span><span class="price">${it.price}</span></div><div class="desc">${it.description || ''}</div>`).join('')}
      </div>`;
    }).join('');
    window.pdfReady = true;
  </script>
</body>
</html>
